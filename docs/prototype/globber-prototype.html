<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Globber Redesign Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* =====================================================================
   STARTER base.css — production-prototype skill
   1 tokens · 2 mode themes (EXAMPLES: replace colours per brief) · 3 type · 4 base
   5 device + Dynamic Island · 6 components · 7 stage (hero reactions) · 8 motion
   Add your screen CSS in a new "9. SCREENS" section below; don't edit engine rules in place.
   ===================================================================== */
/* ---------- 1. TOKENS ---------- */
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--gut:20px;
  --r-sm:12px;--r-md:16px;--r-lg:22px;--r-xl:24px;--r-sheet:32px;--r-pill:999px;
  --d1:160ms;--d2:320ms;--d3:560ms;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --f:"Plus Jakarta Sans",system-ui,sans-serif;--m:"Geist Mono",ui-monospace,monospace;
}

/* ---------- 2. MODE THEMES (set on .phone[data-theme]) ---------- */
/* EXAMPLE default theme (dark): graphite + orange. Rename/recolour per mode. */
.phone{
  --bg:#0E0F11;--surface:#17191C;--surface-2:#22252A;--text:#F3F4F6;--text-2:#9AA0A8;--line:#2B2F35;
  --hair:#ffffff0f;--hair-2:#ffffff1a;
  --acc:#FF6A1A;--acc-2:#FF9A4D;--acc-ink:#1A0B03;--acc-soft:#FF6A1A24;--acc-t:#FF8C52;
  --glass:rgba(23,25,28,.76);--glass-line:rgba(255,255,255,.08);
  --sh-1:0 0 0 1px var(--hair),0 8px 22px -14px #000;--sh-2:0 18px 40px -16px #000;
  --ok:#2BD47F;--ok-bg:#2BD47F1F;--ok-ink:#5BE39C;--warn:#FF4D4D;--warn-bg:#FF4D4D1F;--warn-ink:#FF7A7A;
  --info:#4C9BFF;--info-bg:#4C9BFF1F;--info-ink:#8DBDFF;
  --floor:#1A1C20;--floor-2:#121316;--plate:#2A2E35;--metal-1:#E9EDF2;--metal-2:#8A929C;
  color-scheme:dark}
/* EXAMPLE second theme (light): warm daylight + teal */
.phone[data-theme="light"]{
  --bg:#F5F3EE;--surface:#FFFFFF;--surface-2:#ECE9E2;--text:#14171A;--text-2:#676C73;--line:#E1DED6;
  --hair:#0000000d;--hair-2:#00000014;
  --acc:#0FB59B;--acc-2:#3FD4B9;--acc-ink:#FFFFFF;--acc-soft:#0FB59B1F;--acc-t:#08876F;
  --glass:rgba(255,255,255,.78);--glass-line:rgba(255,255,255,.95);
  --sh-1:0 0 0 1px var(--hair),0 6px 18px -10px #00000026;--sh-2:0 18px 40px -18px #00000040;
  --ok:#1FB46E;--ok-bg:#1FB46E1F;--ok-ink:#0B7A47;--warn:#E5484D;--warn-bg:#E5484D1A;--warn-ink:#C22A2F;
  --info:#3B82C4;--info-bg:#3B82C41F;--info-ink:#276199;
  --floor:#E8E4DC;--floor-2:#DDD8CE;--plate:#D9D4CA;--metal-1:#FFFFFF;--metal-2:#A7ADB4;
  color-scheme:light}

/* ---------- 3. TYPE SCALE (the only font sizes in the app) ---------- */
.t-display{font:800 40px/44px var(--f);letter-spacing:-.03em;margin:0;text-wrap-style:balance}
.t-title{font:800 28px/32px var(--f);letter-spacing:-.025em;margin:0;text-wrap-style:balance}
.t-h{font:700 17px/22px var(--f);letter-spacing:-.015em;margin:0}
.t-body{font:500 16px/24px var(--f);margin:0;text-wrap-style:pretty}
.t-meta{font:500 13px/18px var(--f);margin:0}
.t-label{font:600 12px/16px var(--f)}
.t-btn{font:700 16px/20px var(--f)}
.t-num-xl{font:800 52px/56px var(--f);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.t-num-l{font:700 24px/28px var(--f);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.t-num{font:600 14px/20px var(--f);font-variant-numeric:tabular-nums}
.t-mono{font-family:var(--m);font-weight:500;letter-spacing:.01em}
.up{text-transform:uppercase;letter-spacing:.08em}
.mute{color:var(--text-2)}.ok-t{color:var(--ok-ink)}.warn-t{color:var(--warn-ink)}.acc-t{color:var(--acc-t)}

/* ---------- 4. BASE + UTILITIES ---------- */
@property --p{syntax:"<number>";inherits:false;initial-value:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#101215;color:#eee;font-family:var(--f);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-80px;z-index:-1;filter:blur(70px);background:radial-gradient(50% 45% at 20% 30%,#5a2a12,transparent 70%),radial-gradient(45% 40% at 80% 75%,#0d4a43,transparent 70%),linear-gradient(180deg,#141619,#0c0d0f)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font-family:var(--f)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,p{margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.row.start{justify-content:flex-start}
.stack{display:grid;gap:var(--s3)}.stack-2{display:grid;gap:var(--s2)}.stack-1{display:grid;gap:var(--s1)}.stack-4{display:grid;gap:var(--s4)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.grow{flex:1;min-width:0}.center{text-align:center;justify-items:center}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:24px;height:24px;flex:none}
.ic.s{width:18px;height:18px}.ic.xs{width:14px;height:14px}.ic.l{width:32px;height:32px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes rot{to{rotate:360deg}}
@keyframes shake{25%{translate:-8px 0}50%{translate:8px 0}75%{translate:-4px 0}}
.shake{animation:shake .4s}

/* ---------- 5. STAGE + DEVICE ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding:72px var(--s4) 16px}
.simbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 24px;background:#1e1e1e;border-bottom:1px solid #000;z-index:10}
.simbar .dev{display:grid}.simbar .dev b{font:700 15px/18px -apple-system,var(--f);color:#fff}.simbar .dev span{font:400 12px/14px -apple-system,var(--f);color:#a1a1a1}
.ctrls{display:flex;gap:2px;padding:4px;border-radius:12px;background:#2a2a2a;box-shadow:inset 0 0 0 1px #3a3a3a}
.ctl{width:40px;height:34px;display:grid;place-items:center;border-radius:8px;color:#e8e8e8}.ctl:hover{background:#ffffff1f}
.ctl span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fit{position:relative;flex:none}
.device{position:absolute;left:0;top:0;width:418px;height:890px;padding:8px;border-radius:66px;transform-origin:0 0;
  background:linear-gradient(145deg,#3c3c3f,#1c1c1e 30%,#2c2c2e 55%,#141416 80%,#38383a);box-shadow:0 40px 80px #0009,0 0 0 1px #000,inset 0 0 0 1.5px #5a5a5e,inset 0 0 3px #000}
.device::before,.device::after{content:"";position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#3a3632,#8d877f)}
.device::before{left:-4px;top:19%;height:7%;box-shadow:0 70px 0 #6d6760,0 130px 0 #6d6760}
.device::after{right:-4px;top:28%;height:11%}
/* desktop haptic fallback: uses translate/scale props, never transform (device uses transform for fit) */
.device.hx-error{animation:hxErr .4s}.device.hx-warning{animation:hxWarn .35s}.device.hx-success,.device.hx-heavy{animation:hxPulse .3s}
@keyframes hxErr{20%{translate:-2px 0}40%{translate:2px 0}60%{translate:-2px 0}80%{translate:1px 0}}
@keyframes hxWarn{30%{translate:0 -1.5px}60%{translate:0 1px}}
@keyframes hxPulse{40%{scale:1.004}}
.phone{width:402px;height:874px;background:var(--bg);color:var(--text);border-radius:58px;position:relative;overflow:hidden;isolation:isolate;transition:background-color var(--d3),color var(--d3)}
.status{height:54px;position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 40px;font:600 15px/20px -apple-system,"SF Pro Text",var(--f);z-index:40;color:var(--text);pointer-events:none}
.status .sig{display:flex;gap:6px;align-items:center}
.sf{position:absolute;top:0;left:0;right:0;height:56px;z-index:35;pointer-events:none;background:linear-gradient(180deg,var(--bg) 40%,transparent)}
.phone.nosf .sf{opacity:0}
.homebar{position:absolute;bottom:8px;left:50%;translate:-50% 0;width:136px;height:5px;border-radius:3px;background:var(--text);z-index:60;opacity:.85;pointer-events:none}

/* dynamic island (engine from reference; isl-* namespaced) */
.island{position:absolute;top:11px;left:50%;translate:-50% 0;width:124px;height:36px;background:#000;border-radius:20px;z-index:70;color:#fff;overflow:hidden;cursor:pointer;
  transition:width .5s var(--spring),height .5s var(--spring),border-radius .5s var(--spring),box-shadow .3s,translate .2s var(--ease);display:flex;align-items:center;padding:0 16px}
.island::after{content:"";position:absolute;right:14px;top:50%;width:11px;height:11px;translate:0 -50%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2a3550 0 20%,#0b0f1a 45%,#000 70%);transition:opacity .2s;pointer-events:none}
.island:is(.open,.big,.cmpt,.pre)::after{opacity:0}
.island .in{display:flex;align-items:center;gap:var(--s3);width:100%;opacity:0;transition:opacity var(--d1);white-space:nowrap;position:relative;padding:0 4px}
.island.open{width:370px;height:76px;border-radius:38px;box-shadow:0 14px 34px -14px color-mix(in srgb,var(--tint,#000) 75%,transparent),inset 0 0 0 1px #ffffff12}
.island.open .in{opacity:1;transition-delay:.18s}
.island.tall{height:96px;border-radius:40px}
.island.tall .isl-tx small{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.isl-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--tint,#fff) 22%,transparent),0 6px 16px -6px var(--tint,#000)}
.isl-tx{min-width:0;flex:1;display:grid;gap:1px}
.isl-tx b{color:#fff;font:700 15px/19px var(--f);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.isl-tx small{font:500 12.5px/16px var(--f);color:#a9a49c;overflow:hidden;text-overflow:ellipsis}
.isl-act{flex:none;height:32px;padding:0 14px;border-radius:999px;color:#fff;font:600 13px/18px var(--f);box-shadow:inset 0 1px 0 #ffffff40;animation:txIn .45s .32s var(--ease) both}
.isl-pr{position:absolute;left:56px;right:20px;bottom:-14px;height:3px;border-radius:2px;background:#ffffff14;overflow:hidden}
.isl-pr::after{content:"";position:absolute;inset:0;background:var(--tint,#fff);transform-origin:left;animation:islPr var(--ms,2800ms) linear forwards;opacity:.8}
.island.hold .isl-pr::after{animation-play-state:paused}
@keyframes islPr{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.island.drop{animation:islDrop .62s var(--spring)}
@keyframes islDrop{0%{transform:translateY(-4px) scale(.96)}55%{transform:translateY(2px) scale(1.01)}100%{transform:none}}
.island.settle{animation:islSettle .45s var(--spring)}
@keyframes islSettle{0%{transform:scaleX(1.08) scaleY(.92)}100%{transform:none}}
.island.open .isl-ic{animation:icIn .55s .14s var(--spring) both}
.island.open .isl-tx b{animation:txIn .45s .2s var(--ease) both}
.island.open .isl-tx small{animation:txIn .45s .27s var(--ease) both}
@keyframes icIn{0%{transform:scale(.3) rotate(-35deg);opacity:0;filter:blur(4px)}100%{transform:none;opacity:1;filter:none}}
@keyframes txIn{0%{transform:translateY(6px);opacity:0;filter:blur(3px)}100%{transform:none;opacity:1;filter:none}}
.island .in.swap{animation:txIn .35s var(--ease)}
.island.closing .in{opacity:0!important;filter:blur(5px);transform:scale(.96);transition:opacity .17s,filter .17s,transform .17s;transition-delay:0s!important}
.island .cmp,.island .live{position:absolute;opacity:0;pointer-events:none;transition:opacity .2s}
.island.pre{width:210px;height:36px;border-radius:20px}
.island.cmpt:not(.open):not(.big):not(.pre){width:196px}
.island.cmpt:not(.open):not(.big):not(.pre) .cmp{opacity:1;transition-delay:.2s}
.cmp{left:8px;right:12px;top:0;bottom:0;display:flex;align-items:center;justify-content:space-between}
.isl-ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#ffffff26 0);-webkit-mask:radial-gradient(circle,transparent 6px,#000 6.5px);mask:radial-gradient(circle,transparent 6px,#000 6.5px)}
.isl-cm{display:flex;align-items:center;gap:6px}.isl-cm b{color:#fff;font-variant-numeric:tabular-nums}
.isl-dot{width:8px;height:8px;border-radius:50%;background:var(--c,#2BD47F);animation:breathe 1.6s ease-in-out infinite}
.island.big{width:378px;height:170px;border-radius:44px;box-shadow:0 18px 40px -16px #000c,inset 0 0 0 1px #ffffff12}
.island.big .live{opacity:1;pointer-events:auto;transition-delay:.22s}
.live{left:18px;right:18px;top:16px;bottom:16px;display:grid;gap:10px;align-content:start}
.island.big .live>*{animation:txIn .45s var(--ease) both}.island.big .live>*:nth-child(2){animation-delay:.05s}.island.big .live>*:nth-child(3){animation-delay:.1s}
.isl-top{display:flex;align-items:center;gap:12px}
.isl-pct{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#ffffff1f 0);position:relative;flex:none}
.isl-pct::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#000}.isl-pct b{position:relative;color:#fff;font:700 12px/16px var(--f)}
.isl-row{display:flex;justify-content:space-between;color:#b9b4ac}
.isl-acts{display:flex;gap:8px}
.isl-b{flex:1;height:34px;border-radius:999px;background:#ffffff1a;color:#fff;font:600 13px/18px var(--f);display:flex;align-items:center;justify-content:center;gap:4px}
.isl-b:hover{background:#ffffff26}.isl-b.acc{background:var(--acc);color:var(--acc-ink)}

/* ---------- 6. COMPONENTS ---------- */
.view{position:absolute;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;padding:60px var(--gut) 124px;display:flex;flex-direction:column;gap:var(--s4);scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view>*{flex-shrink:0}
.phone.notabs .view{padding-bottom:0}
.view.full{padding:0;overflow:hidden;display:block}
.view.f{animation:inF var(--d3) var(--ease)}.view.b{animation:inB var(--d3) var(--ease)}
@keyframes inF{from{opacity:0;translate:28px 0}}
@keyframes inB{from{opacity:0;translate:-28px 0}}
.st{animation:rise var(--d3) var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.view.still .st{animation:none}

/* docked CTA on screens without the tab bar */
.dock{position:sticky;bottom:0;margin:auto calc(var(--gut)*-1) 0;padding:var(--s4) var(--gut) 40px;z-index:5;display:grid;gap:var(--s3)}
.dock::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,transparent,var(--bg) 40%)}

/* sliver: compact bar pins once the big title scrolls away */
.cbar{position:sticky;top:-60px;z-index:20;margin:-60px calc(var(--gut)*-1) -36px;height:96px;padding:50px var(--gut) 0;display:flex;align-items:center;gap:var(--s3);
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);box-shadow:0 1px 0 var(--hair-2);opacity:0;translate:0 -8px;pointer-events:none;transition:opacity var(--d2),translate var(--d2) var(--ease)}
.cbar.on{opacity:1;translate:0 0;pointer-events:auto}
.cbar .t-h{flex:1;min-width:0;text-align:center;padding-right:44px}
.cbar.nb .t-h{padding:0}
.cbar .icon-btn{width:40px;height:40px}

.press{position:relative;overflow:hidden;transition:transform var(--d1) var(--spring),opacity var(--d1)}
.press:active{transform:scale(.97) translateY(1px);opacity:.92}
.icon-btn.press:active{transform:scale(.9)}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.12;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);white-space:nowrap;width:100%;min-height:54px;padding:0 var(--s5);border-radius:var(--r-pill);
  background:var(--text);color:var(--bg);font:700 16px/20px var(--f)}
.btn.brand{background:linear-gradient(180deg,var(--acc-2),var(--acc));color:var(--acc-ink);box-shadow:inset 0 1px 0 #ffffff55,0 10px 24px -12px var(--acc)}
.btn.ghost{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--hair)}
.btn.danger{background:var(--warn);color:#fff}
.btn.sm{width:auto;min-height:40px;padding:0 var(--s4);font:700 14px/18px var(--f)}
.btn:disabled{opacity:.35;pointer-events:none}
.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--text);background:var(--glass);backdrop-filter:blur(16px);box-shadow:var(--sh-1),inset 0 0 0 1px var(--glass-line)}
.avatar{width:44px;height:44px;flex:none;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--acc)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lg{width:72px;height:72px;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--acc)}

.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--sh-1)}
.card.glass{background:var(--glass);backdrop-filter:blur(16px)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);padding:0 2px}
.sec>.t-label:first-child{text-transform:uppercase;letter-spacing:.08em;color:var(--text-2)}

/* grouped card list */
.txcard{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden;display:grid}
.txr{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:center;min-height:68px;padding:var(--s3) var(--s4);text-align:left;width:100%;position:relative}
.txr+.txr::before{content:"";position:absolute;top:0;left:72px;right:0;height:1px;background:var(--line)}
.txr .main{display:grid;min-width:0}
.txr .end{display:grid;justify-items:end;gap:2px}
.txr.press:active{background:var(--surface-2)}

.tile{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--text)}
.tile.sm{width:36px;height:36px;border-radius:var(--r-sm)}.tile.xs{width:22px;height:22px;border-radius:7px}.tile.lg{width:56px;height:56px;border-radius:18px}
.tile.acc{background:var(--acc-soft);color:var(--acc-t)}.tile.ok{background:var(--ok-bg);color:var(--ok-ink)}
.tile.info{background:var(--info-bg);color:var(--info-ink)}.tile.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tile.solid{background:var(--acc);color:var(--acc-ink)}

.badge{display:inline-flex;align-items:center;gap:var(--s1);padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--text);white-space:nowrap;animation:pillIn .4s var(--spring)}
.badge.ok{background:var(--ok-bg);color:var(--ok-ink)}.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}
.badge.info{background:var(--info-bg);color:var(--info-ink)}.badge.acc{background:var(--acc-soft);color:var(--acc-t)}
.badge .ic{width:14px;height:14px}
@keyframes pillIn{from{scale:.7;opacity:0}}

.field{display:flex;align-items:center;gap:var(--s3);min-height:52px;padding:0 var(--s4);border-radius:var(--r-pill);background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow var(--d2)}
.field:focus-within{box-shadow:inset 0 0 0 1.5px var(--acc),0 0 0 4px var(--acc-soft)}
.field input{flex:1;min-width:0;border:0;background:none;outline:0;color:inherit;font:500 16px/24px var(--f)}
.field input::placeholder{color:var(--text-2)}
.err-msg{display:flex;gap:6px;align-items:center;color:var(--warn-ink)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:var(--r-pill);padding:4px;position:relative}
.seg .si{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));background:var(--acc);border-radius:var(--r-pill);
  transition:transform var(--d3) cubic-bezier(.34,1.4,.64,1);transform:translateX(calc(var(--k)*100%));box-shadow:0 2px 8px -2px #0003}
.seg button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border-radius:var(--r-pill);font:600 13px/18px var(--f);color:var(--text-2);transition:color var(--d2);white-space:nowrap}
.seg button.on{color:var(--acc-ink)}

.toggle{width:50px;height:30px;border-radius:var(--r-pill);background:var(--line);position:relative;transition:background var(--d2);flex:none}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 2px 4px #0003;transition:transform var(--d2) var(--spring),width var(--d1)}
.toggle:active::after{width:30px}
.toggle[aria-checked="true"]{background:var(--ok)}.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.toggle[aria-checked="true"]:active::after{transform:translateX(14px)}

.chips{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--gut)*-1);padding:2px var(--gut)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:var(--r-pill);background:var(--surface-2);font:600 13px/18px var(--f);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--hair);white-space:nowrap}
.chip.on{background:var(--acc);color:var(--acc-ink);box-shadow:none;animation:popOn .35s var(--spring)}
@keyframes popOn{0%{scale:.97}60%{scale:1.015}100%{scale:1}}

.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:var(--r-lg)}
@keyframes sk{to{background-position:-200% 0}}
.empty{display:grid;justify-items:center;text-align:center;gap:var(--s3);padding:var(--s6) var(--s4)}
.empty svg.art{width:150px;height:auto;animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{translate:0 -6px}}

.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--acc);animation:fill .9s var(--ease) both}
@keyframes fill{from{width:0}}

.sheet{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end}
.sheet-bd{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);animation:fade var(--d2)}
.sheet-pn{position:relative;width:100%;max-height:88%;overflow-y:auto;scrollbar-width:none;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:0 var(--gut) 40px;
  background:var(--surface);color:var(--text);box-shadow:var(--sh-2);display:grid;gap:var(--s4);align-content:start;animation:up var(--d3) var(--spring)}
.sheet-pn::-webkit-scrollbar{display:none}
.sheet-pn>*:not(.grab){animation:rise .45s var(--ease) both}
.sheet-pn>*:nth-child(2){animation-delay:.04s}.sheet-pn>*:nth-child(3){animation-delay:.08s}.sheet-pn>*:nth-child(4){animation-delay:.12s}.sheet-pn>*:nth-child(5){animation-delay:.16s}.sheet-pn>*:nth-child(6){animation-delay:.2s}
.grab{height:26px;display:grid;place-items:center;touch-action:none;cursor:grab;margin:0 calc(var(--gut)*-1)}
.grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line);transition:width var(--d1)}
.grab:active::before{width:56px}
.sheet.out .sheet-pn{animation:down var(--d2) var(--ease) forwards}
.sheet.out .sheet-bd{animation:fadeout var(--d2) forwards}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fadeout{to{opacity:0}}

/* floating tab bar */
.tabs{position:absolute;left:var(--s4);right:var(--s4);bottom:24px;height:68px;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:var(--r-pill);
  background:var(--glass);backdrop-filter:blur(28px) saturate(1.6);box-shadow:var(--sh-2),inset 0 0 0 1px var(--glass-line);transition:transform var(--d3) var(--ease),opacity var(--d2)}
.tabs[hidden]{display:grid!important;transform:translateY(130%);opacity:0;pointer-events:none}
.tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:var(--r-pill);background:var(--acc);transition:transform var(--d3) var(--spring),opacity var(--d2);z-index:0}
.tabs button{position:relative;z-index:1;display:grid;justify-items:center;align-content:center;gap:1px;color:var(--text-2);transition:color var(--d2);border-radius:var(--r-pill)}
.tabs button.on{color:var(--acc-ink)}
.tabs button.on .ic{animation:hop .5s var(--spring)}
.tabs button .ic{width:22px;height:22px}
@keyframes hop{40%{translate:0 -4px;scale:1.1}}

/* swipe-to-confirm */
.swipe{position:relative;height:62px;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--acc),var(--acc-2));overflow:hidden;touch-action:none;user-select:none;flex:none}
.swipe .fill{position:absolute;inset:0;width:0;background:#0000001a}
.swipe .lbl{position:absolute;inset:0;display:grid;place-items:center;padding-left:40px;font:700 16px/20px var(--f);color:var(--acc-ink)}
.swipe::after{content:"›››";position:absolute;right:24px;top:50%;translate:0 -52%;font:600 22px/22px var(--f);letter-spacing:-1px;color:var(--acc-ink);animation:chev 1.6s ease-in-out infinite}
@keyframes chev{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:.7;transform:translateX(4px)}}
.swipe .knob{position:absolute;top:5px;left:5px;width:52px;height:52px;border-radius:50%;background:var(--acc-ink);display:grid;place-items:center;color:var(--acc);cursor:grab;z-index:2;box-shadow:0 4px 10px #0003}
.swipe.done .knob{background:var(--ok);color:#fff}
.swipe.snap .knob,.swipe.snap .fill{transition:all var(--d2) var(--spring)}

/* stage: hero object on a floor line with floating cards */
.stg{position:relative;border-radius:var(--r-xl);overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,var(--acc-soft),transparent 60%),var(--surface);box-shadow:var(--sh-1)}
.floor{position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(180deg,var(--floor),var(--floor-2));border-top:1px solid var(--hair-2)}
.floor::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,var(--hair) 46px 48px)}
.hero{position:absolute;left:50%;translate:-50% 0;transition:filter var(--d2)}
.hero svg{display:block;width:100%;height:auto;overflow:visible}
.hero .bb{transform-box:fill-box;transform-origin:50% 100%}
.hero.rep .bb{animation:rep .9s var(--ease)}
@keyframes rep{0%{transform:none}35%{transform:translateY(-34px)}45%{transform:translateY(-34px) scaleX(.995)}100%{transform:none}}
.hero.stall .bb{animation:stall .6s ease-out}
@keyframes stall{0%{transform:none}20%{transform:translateY(-14px)}30%{transform:translateY(-14px) translateX(-3px)}40%{transform:translateY(-12px) translateX(3px)}50%{transform:translateY(-13px) translateX(-2px)}100%{transform:none}}
.hero.hop .bb{animation:hopb .6s var(--spring)}
@keyframes hopb{40%{transform:translateY(-12px)}}
.hero.idle .bb{animation:idle 3.6s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-1.5px)}}
.shadow{transform-box:fill-box;transform-origin:50% 50%}
.hero.rep .shadow{animation:shad .9s var(--ease)}
@keyframes shad{35%,45%{opacity:.35;transform:scaleX(.7)}}
.fl{position:absolute;z-index:2;display:flex;align-items:center;gap:var(--s2);padding:8px 12px 8px 8px;border-radius:var(--r-pill);background:var(--glass);backdrop-filter:blur(14px);box-shadow:var(--sh-1),inset 0 0 0 1px var(--glass-line);animation:rise .6s var(--ease) both,float 4s ease-in-out 1s infinite}
.fl .tile{width:28px;height:28px;border-radius:50%}

/* ---------- 8. MOTION POLISH ---------- */
.bump{animation:bump .45s var(--spring)}
@keyframes bump{40%{scale:1.08;color:var(--acc-t)}}
.nd{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
@media (hover:hover){.card.press:hover,.txcard:hover{translate:0 -2px;transition:translate var(--d2) var(--ease)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.splash{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:var(--s6);background:var(--bg);cursor:pointer}

/* =====================================================================
   GLOBBER app.css — themes, Android frame, screens
   ===================================================================== */

/* ---------- THEMES: Globber dark (neon lime on near-black) + light ---------- */
.phone{
  --bg:#0A0C07;--surface:#14170F;--surface-2:#1E2318;--text:#F2F5EA;--text-2:#949B88;--line:#2A3021;
  --hair:#ffffff0f;--hair-2:#ffffff1a;
  --acc:#C6FF00;--acc-2:#DBFF5C;--acc-ink:#0A0C07;--acc-soft:#C6FF0024;--acc-t:#D4FF4A;
  --glass:rgba(20,23,15,.78);--glass-line:rgba(255,255,255,.07);
  --sh-1:0 0 0 1px var(--hair),0 8px 22px -14px #000;--sh-2:0 18px 40px -16px #000;
  --ok:#3DDC84;--ok-bg:#3DDC841F;--ok-ink:#6BE7A3;--warn:#FF5A4E;--warn-bg:#FF5A4E1F;--warn-ink:#FF8A80;
  --info:#7FB8FF;--info-bg:#7FB8FF1F;--info-ink:#A9CEFF;
  --floor:#12150D;--floor-2:#0C0E08;--shield-1:#DBFF5C;--shield-2:#8FBF00;--shield-ink:#0A0C07;
  color-scheme:dark}
.phone[data-theme="light"]{
  --bg:#F4F6EE;--surface:#FFFFFF;--surface-2:#E8ECDD;--text:#13160E;--text-2:#61685A;--line:#DCE1CF;
  --hair:#0000000d;--hair-2:#00000014;
  --acc:#B8F000;--acc-2:#D2FF45;--acc-ink:#13160E;--acc-soft:#9BCB0026;--acc-t:#4E6B00;
  --glass:rgba(255,255,255,.8);--glass-line:rgba(255,255,255,.95);
  --sh-1:0 0 0 1px var(--hair),0 6px 18px -10px #00000026;--sh-2:0 18px 40px -18px #00000040;
  --ok:#1E9E5A;--ok-bg:#1E9E5A1A;--ok-ink:#127543;--warn:#E5484D;--warn-bg:#E5484D1A;--warn-ink:#C22A2F;
  --info:#2F74C0;--info-bg:#2F74C01A;--info-ink:#245C99;
  --floor:#E6EBD8;--floor-2:#DCE2CB;--shield-1:#C9F72E;--shield-2:#7FA800;--shield-ink:#13160E;
  color-scheme:light}

/* ---------- ANDROID FRAME (Pixel-style) ---------- */
body::before{background:radial-gradient(50% 45% at 20% 30%,#2c3a08,transparent 70%),radial-gradient(45% 40% at 80% 75%,#0d2a1c,transparent 70%),linear-gradient(180deg,#121410,#0b0c0a)}
.device{border-radius:48px;padding:8px;background:linear-gradient(145deg,#2f322b,#151713 30%,#24271f 55%,#10120e 80%,#2d3029)}
.device::before{left:auto;right:-4px;top:22%;height:6%;box-shadow:none}
.device::after{right:-4px;top:32%;height:12%}
.phone{border-radius:40px}
.status{height:44px;padding:6px 28px 0 30px;font:600 14px/20px "Plus Jakarta Sans",system-ui,sans-serif}
.status .sig{gap:7px}
.homebar{width:108px;height:4px;bottom:9px;opacity:.6}
/* punch-hole camera that grows into an alert pill (engine #island) */
.island{top:12px;width:22px;height:22px;border-radius:50%;padding:0 12px}
.island::after{right:50%;translate:50% -50%;width:10px;height:10px}
.island.pre{width:150px;height:22px;border-radius:14px}
.island.open{width:368px;height:66px;border-radius:33px}
.island.tall{height:84px;border-radius:36px}
.isl-ic{width:40px;height:40px}
.isl-pr{bottom:-10px}
.view{padding-top:52px}
.cbar{top:-52px;margin-top:-52px;padding-top:42px;height:88px}

/* tabs: Material-style nav bar inside floating pill */
.tabs{grid-template-columns:repeat(4,1fr);bottom:22px}
.tabs .ind{width:calc((100% - 12px)/4)}

/* ---------- SPLASH ---------- */
.spl{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:18px;background:radial-gradient(70% 45% at 50% 42%,#C6FF0026,transparent 70%),#0A0C07;color:#F2F5EA;cursor:pointer;text-align:center}
.spl .hero{position:relative;left:auto;translate:none;width:150px;animation:splDrop .9s var(--spring) both}
@keyframes splDrop{0%{opacity:0;transform:translateY(-60px) scale(.8)}60%{opacity:1}100%{transform:none}}
.spl .ring{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid #C6FF00;opacity:0;animation:splRing 2.2s .6s ease-out infinite}
.spl .ring.r2{animation-delay:1.3s}
@keyframes splRing{0%{opacity:.6;scale:.7}100%{opacity:0;scale:2.2}}
.spl .wm{display:grid;gap:6px;animation:rise .7s .35s var(--ease) both}
.spl .wm small{color:#949B88}
.spl .ld{width:120px;height:4px;border-radius:2px;background:#ffffff14;overflow:hidden;margin:6px auto 0}
.spl .ld i{display:block;height:100%;width:40%;border-radius:2px;background:#C6FF00;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{translate:-100% 0}100%{translate:260% 0}}
.spl .foot{position:absolute;bottom:42px;left:0;right:0;display:flex;justify-content:center;gap:8px;color:#949B88;animation:fade .6s .9s both}

/* ---------- ONBOARDING ---------- */
.ob{position:absolute;inset:0;display:flex;flex-direction:column;padding:56px var(--gut) 34px;gap:var(--s4);background:var(--bg)}
.ob-top{display:flex;align-items:center;justify-content:space-between}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width var(--d2) var(--spring),background var(--d2)}
.dots i.on{width:24px;background:var(--acc)}
.ob-art{position:relative;height:330px;border-radius:var(--r-xl);overflow:hidden;background:radial-gradient(110% 80% at 50% 0%,var(--acc-soft),transparent 65%),var(--surface);box-shadow:var(--sh-1)}
.ob-copy{display:grid;gap:8px}
.ob .dock{margin-top:auto;margin-left:0;margin-right:0;padding:0;position:static}
.ob .dock::before{display:none}
.skip{color:var(--text-2);padding:8px 4px}

/* pattern matcher art (onboarding 1) */
.pm{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:14px;padding:18px}
.pm-pat{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:var(--r-pill);background:var(--acc);color:var(--acc-ink);box-shadow:0 10px 30px -10px var(--acc)}
.pm-pat .t-mono{font-size:18px;font-weight:600}
.pm-list{display:grid;gap:8px;width:100%}
.pm-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--hair);animation:pmIn .5s var(--ease) both;animation-delay:calc(var(--i)*.35s + .3s)}
.pm-row .t-mono{font-size:15px}
.pm-row .t-mono em{font-style:normal;color:var(--acc-t);background:var(--acc-soft);border-radius:4px;padding:0 2px}
.pm-row.x{opacity:.55}
@keyframes pmIn{from{opacity:0;translate:30px 0}}

/* phone-role art (onboarding 2) */
.role{position:absolute;inset:0;display:grid;place-items:center}
.role .hero{position:relative;left:auto;translate:none;width:112px;top:-34px}
.role .fl.a{left:16px;top:16px}.role .fl.b{right:16px;bottom:72px;animation-delay:.2s,1.2s}.role .fl.c{left:16px;bottom:18px;animation-delay:.4s,1.4s}

/* sys dialog (Android role request) */
.sys{position:absolute;inset:0;z-index:80;display:grid;place-items:center;padding:28px;background:#0009;animation:fade .2s}
.sys-pn{width:100%;border-radius:28px;padding:24px;background:#2B2E26;color:#E6E9DF;display:grid;gap:14px;animation:sysIn .35s var(--spring)}
.phone[data-theme="light"] .sys-pn{background:#F1F3EA;color:#1B1D17}
@keyframes sysIn{from{opacity:0;scale:.9}}
.sys-pn .sys-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);justify-self:center}
.sys-pn .t-h{text-align:center}
.sys-pn .opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#ffffff0d}
.phone[data-theme="light"] .sys-pn .opt{background:#0000000a}
.sys-pn .opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;flex:none;opacity:.6}
.sys-pn .opt.on .rd{opacity:1;border-color:var(--acc)}.sys-pn .opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc)}
.sys-acts{display:flex;justify-content:flex-end;gap:8px}
.sys-acts button{padding:10px 16px;border-radius:999px;font:600 14px/18px var(--f);color:var(--acc-t)}
.phone[data-theme="dark"] .sys-acts button{color:#C6FF00}
.sys-acts button.pri{background:var(--acc);color:var(--acc-ink)!important}

/* ---------- HERO: shield ---------- */
.shield-hero .glow{animation:breathe 2.6s ease-in-out infinite}
.hero.block .bb{animation:blockb .7s var(--spring)}
@keyframes blockb{0%{transform:none}30%{transform:translateY(-10px) scale(1.06)}60%{transform:translateY(2px) scale(.98)}100%{transform:none}}
.hero.off .bb{filter:grayscale(1);opacity:.55}

/* ---------- HOME ---------- */
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd .brand-m{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);box-shadow:0 8px 20px -10px var(--acc)}
.prot{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok-ink)}
.prot.off{background:var(--warn-bg);color:var(--warn-ink)}
.prot i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:breathe 1.6s infinite}
.banner{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r-lg);background:var(--warn-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 35%,transparent)}
.banner .btn{width:auto}
.home-stg{height:236px}
.home-stg .hero{width:124px;bottom:30px;left:73%}
.home-stg .fl.a{left:14px;top:16px}.home-stg .fl.b{left:14px;top:68px;animation-delay:.15s,1.1s}.home-stg .fl.c{left:14px;top:120px;animation-delay:.3s,1.3s}
.home-stg .sim{position:absolute;left:14px;bottom:9px;z-index:3}
.kpi{display:grid;gap:10px;padding:14px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);text-align:left}
.kpi.hot{background:var(--acc);color:var(--acc-ink)}
.kpi.hot .mute{color:#0A0C07b0}
.kpi .row{align-items:flex-start}
.kpi.hot .tile{background:#0A0C0718;color:var(--acc-ink)}
.chart{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:8px;height:120px;padding-top:8px}
.chart .c{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.chart .c i{width:100%;max-width:30px;border-radius:8px;background:var(--surface-2);height:calc(var(--h)*.9px);transform-origin:bottom;animation:grow .8s var(--ease) both;animation-delay:calc(var(--i)*50ms)}
.chart .c.on i{background:linear-gradient(180deg,var(--acc-2),var(--acc))}
.chart .c b{font:600 11px/14px var(--f);color:var(--text-2)}
@keyframes grow{from{transform:scaleY(0)}}
.num-call{font-family:var(--m);font-weight:600;letter-spacing:.01em}

/* incoming-call overlay (demo moment) */
.inc{position:absolute;inset:0;z-index:75;display:flex;flex-direction:column;align-items:center;padding:110px 24px 60px;gap:10px;background:linear-gradient(180deg,#1b2213,#0A0C07 70%);color:#F2F5EA;animation:fade .3s}
.inc .av{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:#ffffff12;margin-bottom:10px;position:relative}
.inc .av::before,.inc .av::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid #ffffff22;animation:splRing 1.6s ease-out infinite}
.inc .av::after{animation-delay:.8s}
.inc .stamp{margin-top:auto;display:grid;justify-items:center;gap:12px;opacity:0;scale:.6}
.inc.blocked .stamp{animation:stampIn .55s var(--spring) forwards}
.inc.blocked .av{background:#FF5A4E33}
.inc.blocked .av::before,.inc.blocked .av::after{display:none}
@keyframes stampIn{to{opacity:1;scale:1}}
.inc .stamp .seal{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:#C6FF00;color:#0A0C07;box-shadow:0 0 0 10px #C6FF0022,0 20px 40px -12px #C6FF00}
.inc .stamp .seal .ic{width:42px;height:42px}
.inc.out{animation:incOut .45s var(--ease) forwards}
@keyframes incOut{to{opacity:0;translate:0 -30px}}
.inc .ans{margin-top:auto;display:flex;gap:80px}
.inc .ans span{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#3DDC84;color:#0A0C07}
.inc .ans span.r{background:#FF5A4E;color:#fff}
.inc.blocked .ans{display:none}

/* ---------- RULES ---------- */
.fab{position:absolute;right:var(--gut);bottom:104px;z-index:25;display:flex;align-items:center;gap:8px;height:56px;padding:0 20px 0 16px;border-radius:18px;background:var(--acc);color:var(--acc-ink);font:700 15px/20px var(--f);box-shadow:0 14px 30px -12px var(--acc),inset 0 1px 0 #ffffff66;animation:pillIn .5s var(--spring)}
.rule{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);text-align:left;width:100%}
.rule .main{display:grid;gap:4px;min-width:0}
.rule .pat{font:600 16px/22px var(--m);letter-spacing:.01em}
.rule .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rule.off{opacity:.55}
.rule.off .pat{text-decoration:line-through;text-decoration-color:var(--text-2)}
.rule .hits{display:grid;justify-items:end;gap:6px}
.rule.fresh{animation:fresh 1.2s var(--ease)}
@keyframes fresh{0%{box-shadow:0 0 0 2px var(--acc),var(--sh-1)}100%{box-shadow:var(--sh-1)}}
.type-tile{font:700 19px/22px var(--m)}
.tester{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--surface-2)}
.tester.hit{background:var(--acc-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 50%,transparent)}
.tester.miss{background:var(--surface-2)}
.lbl-f{display:grid;gap:8px}
.lbl-f>.t-label{color:var(--text-2);text-transform:uppercase;letter-spacing:.08em}
.field.mono input{font-family:var(--m);font-weight:600;letter-spacing:.02em}
.field.err{box-shadow:inset 0 0 0 1.5px var(--warn),0 0 0 4px var(--warn-bg)}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{display:grid;justify-items:center;gap:6px;padding:12px 6px;border-radius:16px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--hair);text-align:center;color:var(--text-2)}
.opt.on{background:var(--acc-soft);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--acc);animation:popOn .35s var(--spring)}
.opt.on .ic{color:var(--acc-t)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ---------- LOG ---------- */
.day{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 0}
.day .t-label:first-child{text-transform:uppercase;letter-spacing:.08em;color:var(--text-2)}
.skrow{height:68px;border-radius:0}
.det-hero{display:grid;justify-items:center;gap:8px;text-align:center;padding:4px 0 6px}
.det-hero .tile{width:64px;height:64px;border-radius:22px}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.det-grid>div{padding:12px;border-radius:16px;background:var(--surface-2);display:grid;gap:4px;min-width:0}
.act-list{display:grid;gap:8px}
.act{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface-2);text-align:left;width:100%}

/* ---------- SETTINGS ---------- */
.set-row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:68px;text-align:left;width:100%;position:relative}
.set-row+.set-row::before{content:"";position:absolute;top:0;left:72px;right:0;height:1px;background:var(--line)}
.set-row .main{flex:1;display:grid;gap:2px;min-width:0}
.prot-card{display:grid;gap:14px;padding:16px;border-radius:var(--r-xl);background:linear-gradient(135deg,var(--acc-soft),transparent 70%),var(--surface);box-shadow:var(--sh-1)}
.privacy{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-lg);background:var(--surface-2)}
.ver{text-align:center;padding:4px 0 8px}

.toggle[aria-checked="true"]{background:var(--acc)}
.phone[data-theme="light"] .toggle[aria-checked="true"]::after{box-shadow:0 2px 4px #0003,0 0 0 1px #0000000f}

/* ---------- SPLASH v2 (CyberSabra-inspired: void, signal red, fluted glass) ---------- */
.sp2{position:absolute;inset:0;overflow:hidden;background:#0A0A0A;color:#F2F0EE;cursor:pointer;--red:#E8392B}
.sp-rain{position:absolute;inset:-40px 0;display:flex;justify-content:space-between;padding:0 6px;opacity:.9}
.sp-col{display:grid;gap:18px;align-content:start;font:500 13px/16px var(--m);color:#3a3533;animation:rain calc(16s + var(--c)*3s) linear infinite;animation-delay:calc(var(--c)*-2.3s)}
.sp-col:nth-child(even){animation-direction:reverse}
.sp-col span.hot{color:var(--red)}
@keyframes rain{to{translate:0 -50%}}
.sp-blob{position:absolute;width:300px;height:420px;right:-90px;top:120px;border-radius:50%;background:radial-gradient(closest-side,#ff4a35,#c8261c 55%,transparent);opacity:.75;animation:blob 7s ease-in-out infinite alternate}
@keyframes blob{to{translate:-120px 160px;scale:1.15}}
.sp-glass{position:absolute;inset:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  background:linear-gradient(180deg,#0A0A0Acc,#0A0A0A33 35%,#0A0A0A33 65%,#0A0A0Add)}
.sp-meta{position:absolute;top:60px;left:28px;right:28px;display:flex;justify-content:space-between;color:#8C8782;animation:fade .8s 1.2s both}
.sp-core{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:16px}
.mk{width:92px;height:92px;animation:mkSpin 1.4s cubic-bezier(.2,.9,.2,1) both}
.mk .bl{fill:var(--red);transform-origin:60px 60px;transform:rotate(var(--r)) scale(0);animation:blade .6s calc(var(--i)*70ms + .15s) var(--spring) forwards}
@keyframes blade{to{transform:rotate(var(--r)) scale(1)}}
@keyframes mkSpin{from{rotate:-150deg}to{rotate:0deg}}
.sp-wm{font:700 40px/44px var(--f);letter-spacing:.01em;clip-path:inset(0 100% 0 0);animation:wipe .7s .75s var(--ease) forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.sp-tag{color:var(--red);letter-spacing:.04em;animation:rise .6s 1.1s var(--ease) both}
.sp-foot{position:absolute;left:28px;right:28px;bottom:44px;display:grid;gap:12px;justify-items:center}
.sp-line{width:100%;height:2px;background:#ffffff14;overflow:hidden;border-radius:1px}
.sp-line i{display:block;height:100%;width:100%;background:var(--red);transform-origin:left;animation:load 2.8s .3s var(--ease) both}
@keyframes load{from{transform:scaleX(0)}}
.sp-pat{color:#8C8782;animation:fade .6s 1.6s both}
.sp-pat .t-mono{color:#F2F0EE}

/* ---------- SPLASH v3 "The filter": numbers pass the lens; pattern matches break apart ---------- */
.sp3{position:absolute;inset:0;overflow:hidden;background:#0A0A0A;color:#F2F0EE;cursor:pointer;--red:#E8392B}
.sp3-glow{position:absolute;left:50%;top:42%;width:460px;height:460px;margin:-230px 0 0 -230px;border-radius:50%;background:radial-gradient(closest-side,#e8392b40,#e8392b10 55%,transparent);animation:sp3glow 2.8s ease-in-out infinite alternate}
@keyframes sp3glow{to{scale:1.12;opacity:.7}}
.sp3-lanes{position:absolute;left:0;right:0;top:42%}
.ln{position:absolute;left:0;top:var(--y);height:0;white-space:nowrap;display:flex;align-items:center;gap:10px;translate:420px -50%;
  animation:lane 2.6s var(--d) linear forwards}
.ln .t-mono{font-size:17px;font-weight:600;letter-spacing:.02em;color:#8C8782}
.ln.p .t-mono{color:#F2F0EE}
.ln em{font-style:normal;border-radius:4px;padding:0 2px}
@keyframes lane{to{translate:-420px -50%}}
.ln.m{animation-name:laneM}
@keyframes laneM{0%{translate:420px -50%}42%{translate:150px -50%;opacity:1;filter:none}56%{translate:90px -50%;opacity:0;filter:blur(8px);scale:.85}100%{translate:90px -50%;opacity:0}}
.ln.m em{animation:hit 2.6s var(--d) forwards}
@keyframes hit{0%,18%{color:inherit;background:transparent}26%,100%{color:#0A0A0A;background:var(--red)}}
.ln.m .t-mono{animation:mcol 2.6s var(--d) forwards}
@keyframes mcol{0%,24%{color:#8C8782;text-decoration-color:transparent}32%,100%{color:var(--red);text-decoration:line-through;text-decoration-color:var(--red)}}
.ln .x{color:var(--red);opacity:0;animation:fade .2s calc(var(--d) + .7s) forwards}
.sp3-core{position:absolute;left:50%;top:42%;translate:-50% -50%;display:grid;justify-items:center;gap:16px;z-index:2}
.lens{width:176px;height:176px;filter:drop-shadow(0 18px 30px #000);animation:lensIn .9s var(--spring) both}
@keyframes lensIn{from{scale:.4;opacity:0;rotate:-90deg}}
.lens-st{transform-origin:60px 60px;animation:lensSpin 2.4s .3s cubic-bezier(.3,.9,.2,1) both}
@keyframes lensSpin{from{rotate:-180deg}}
.sp3-pat{position:absolute;top:calc(100% + 26px);padding:6px 12px;border-radius:999px;background:#160807;box-shadow:inset 0 0 0 1px #e8392b55;color:#F2F0EE;font-size:14px;font-weight:600}
.sp3-pat span{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;width:0;animation:type .7s .6s steps(8) forwards;border-right:2px solid var(--red)}
@keyframes type{to{width:8ch}}
.sp3-brand{position:absolute;left:0;right:0;bottom:118px;display:grid;justify-items:center;gap:8px;text-align:center}
.sp3-wm{font:800 40px/44px var(--f);letter-spacing:-.02em;animation:rise .7s 3s var(--ease) both}
.sp3-tag{color:#8C8782;animation:rise .7s 3.2s var(--ease) both}
.sp3-foot{position:absolute;left:0;right:0;bottom:42px;display:flex;justify-content:center;align-items:center;gap:8px;color:#8C8782;animation:fade .6s 3.4s both}
.sp3-dot{width:7px;height:7px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 4px #3ddc8422;animation:breathe 1.6s infinite}

/* ---------- SPLASH v3 · ceramic light ---------- */
.sp3{background:radial-gradient(90% 60% at 50% 38%,#f7f5f2,#e9e5df 70%);color:#141414}
.sp3-glow{background:radial-gradient(closest-side,#e8392b1f,#e8392b08 55%,transparent)}
.ln .t-mono{color:#9a948d}
.ln.p .t-mono{color:#141414}
.ln.m em{color:inherit}
@keyframes hit{0%,18%{color:inherit;background:transparent}26%,100%{color:#fff;background:#E8392B}}
.lens{width:168px;height:168px;filter:drop-shadow(0 22px 28px #0000002e) drop-shadow(0 4px 6px #00000014)}
.lens-dot{transform-origin:60px 60px;animation:dotPop .6s 1.1s var(--spring) both}
@keyframes dotPop{from{scale:0}}
.sp3-pat{background:#fff;box-shadow:0 0 0 1px #0000000f,0 6px 14px -8px #0003;color:#141414}
.sp3-tag,.sp3-foot{color:#6b6660}
.sp3-dot{background:#1E9E5A;box-shadow:0 0 0 4px #1e9e5a22}

/* ---------- LAUNCHER (sample Android home) ---------- */
.lnch{position:absolute;inset:0;overflow:hidden;color:#fff;display:flex;flex-direction:column;padding:58px 18px 34px}
.lw{position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 40% at 20% 15%,#f1c7b4,transparent 70%),radial-gradient(70% 50% at 85% 60%,#8b5a4a,transparent 70%),linear-gradient(170deg,#d9a48e,#6d4438 55%,#2b1d1a)}
.l-clock{display:grid;gap:2px;padding:26px 8px 0;text-shadow:0 1px 8px #0004}
.l-clock b{font:300 64px/66px var(--f);letter-spacing:-.03em}
.l-clock span{font:500 15px/20px var(--f)}
.l-wx{display:flex;align-items:center;gap:6px;opacity:.9}
.l-grid{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.la{display:grid;justify-items:center;gap:7px;color:#fff}
.la-ic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;overflow:hidden;box-shadow:0 6px 14px -6px #0006}
.la-ic .ic{width:28px;height:28px}
.la-ic svg:not(.ic){width:100%;height:100%;display:block}
.la-n{font:500 12px/16px var(--f);text-shadow:0 1px 4px #0006}
.la-g .la-ic{box-shadow:0 0 0 3px #ffffff55,0 8px 18px -6px #000a;animation:gPulse 2.4s ease-in-out infinite}
@keyframes gPulse{50%{box-shadow:0 0 0 7px #ffffff22,0 8px 18px -6px #000a}}
.l-search{margin:22px 0 14px;display:flex;align-items:center;gap:10px;height:50px;padding:0 18px;border-radius:999px;background:#ffffffd9;color:#555;font:500 15px/20px var(--f)}
.l-dock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.l-dock .la-n{display:none}
.l-hint{position:absolute;left:0;right:0;top:46%;text-align:center;opacity:0}
.l-zoom{position:absolute;z-index:90;border-radius:50%;overflow:hidden;transition:all .42s cubic-bezier(.3,.9,.3,1)}
.l-zoom svg{width:100%;height:100%;display:block}
.l-zoom.go{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:40px}

/* ---------- ONBOARDING v2 · ceramic story scenes ---------- */
.ob{--acc:#141414;--acc-2:#2c2c2e;--acc-ink:#F7F5F2;--acc-soft:#14141414;--acc-t:#141414;--bg:#EEEBE6;--surface:#FBFAF8;--surface-2:#E6E1DA;background:radial-gradient(90% 55% at 50% 30%,#f7f5f2,#eeebe6 70%)}
.ob .btn.brand{box-shadow:0 10px 24px -12px #000a}
.ob-art{height:350px;background:none;box-shadow:none;overflow:visible}
.scn{width:100%;height:100%;overflow:visible}
.ob-k{color:#E8392B;text-transform:uppercase;letter-spacing:.1em}
.ob .dots i.on{background:#141414}
.bub{opacity:0;animation:bubIn .5s var(--d) var(--spring) forwards,bubBob 3s calc(var(--d) + .5s) ease-in-out infinite}
@keyframes bubIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes bubBob{50%{translate:0 -4px}}
.shake{transform-box:fill-box;transform-origin:center;animation:shk .5s ease-in-out infinite}
@keyframes shk{0%,100%{rotate:0}25%{rotate:-6deg}75%{rotate:6deg}}
.wave{animation:breathe .9s infinite}.w2{animation-delay:.3s}
.drip{animation:drip 1.6s ease-in infinite}
@keyframes drip{0%{translate:0 0;opacity:0}20%{opacity:1}100%{translate:0 26px;opacity:0}}
.pulse{transform-origin:180px 150px;animation:pls 1.2s ease-in-out infinite alternate}@keyframes pls{to{scale:1.08}}
.badge-n{animation:breathe 1s infinite}
.card-in{animation:rise .6s .2s var(--ease) both}
.typed{clip-path:inset(0 100% 0 0);animation:wipe .8s .7s steps(8) forwards}
.tgl{fill:#CFC7BD;animation:tglOn .3s 1.6s forwards}.tgl-k{translate:-16px 0;animation:tglK .3s 1.6s var(--spring) forwards}
@keyframes tglOn{to{fill:#1E9E5A}}@keyframes tglK{to{translate:0 0}}
.fly{offset-path:path("M20 40 C 120 10, 200 90, 272 70");offset-rotate:0deg;opacity:0;animation:fly 2.1s var(--d) ease-in infinite}
@keyframes fly{0%{offset-distance:0%;opacity:0}15%{opacity:1}80%{opacity:1;filter:none}100%{offset-distance:100%;opacity:0;filter:blur(4px)}}
.catch{transform-box:fill-box;transform-origin:center;animation:catchP 2.1s .8s ease-in-out infinite}
@keyframes catchP{75%{scale:1}85%{scale:1.12}100%{scale:1}}
.steam{animation:steam 2.4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;translate:0 6px}40%{opacity:.9}100%{opacity:0;translate:0 -10px}}
.gone{animation:gone 3.2s var(--d) ease-in-out infinite}
@keyframes gone{0%{opacity:.75;translate:0 0}100%{opacity:0;translate:0 -30px}}
.zz{animation:steam 2.6s infinite}.z2{animation-delay:.8s}
.sun{animation:breathe 4s infinite}
.calm{animation:float 4s ease-in-out infinite}

/* ---------- ONBOARDING v3 · calmer motion ---------- */
.bub{animation:bubIn .7s var(--d) var(--ease) forwards}
.buzz{transform-box:fill-box;transform-origin:center;animation:buzz 2.4s ease-in-out infinite}
@keyframes buzz{0%,60%,100%{rotate:0}64%{rotate:-4deg}68%{rotate:4deg}72%{rotate:-3deg}76%{rotate:2deg}80%{rotate:0}}
.wave{animation:waveP 2.4s ease-in-out infinite}
@keyframes waveP{0%,58%,100%{opacity:0}66%,80%{opacity:1}}
.drip{animation:drip 3s ease-in infinite}
.card-in{animation:rise .9s .3s var(--ease) both}
.typed{animation:wipe 1.1s 1s steps(8) forwards}
.tgl{fill:#CFC7BD;animation:tglOn .4s 2.4s forwards}.tgl-k{translate:-16px 0;animation:tglK .5s 2.4s var(--ease) forwards}
.ok-bar{opacity:0;animation:fade .5s 2.8s forwards}

.birds{animation:birds 12s linear infinite}
@keyframes birds{to{translate:200px -20px}}

/* =====================================================================
   CERAMIC SYSTEM — bone, ink, one signal red. Replaces the lime themes.
   ===================================================================== */
.phone,.phone[data-theme="light"]{
  --bg:#EEEBE6;--surface:#FBFAF8;--surface-2:#E6E1DA;--text:#141414;--text-2:#6E6862;--line:#DDD7CF;
  --hair:#0000000d;--hair-2:#00000014;
  --acc:#141414;--acc-2:#2E2F33;--acc-ink:#F7F5F2;--acc-soft:#1414140f;--acc-t:#141414;
  --glass:rgba(251,250,248,.82);--glass-line:rgba(255,255,255,.95);
  --sh-1:0 0 0 1px var(--hair),0 8px 20px -12px #0000002e;--sh-2:0 20px 40px -18px #00000045;
  --ok:#1E9E5A;--ok-bg:#1E9E5A17;--ok-ink:#147444;--warn:#E8392B;--warn-bg:#E8392B14;--warn-ink:#C42A1E;
  --info:#55606E;--info-bg:#55606E14;--info-ink:#3F4853;
  --floor:#E3DED6;--floor-2:#DAD4CB;--red:#E8392B;color-scheme:light}
.phone[data-theme="dark"]{
  --bg:#0E0E0F;--surface:#18181A;--surface-2:#222225;--text:#F2F0EE;--text-2:#97918A;--line:#2C2C30;
  --hair:#ffffff0d;--hair-2:#ffffff17;
  --acc:#F2F0EE;--acc-2:#FFFFFF;--acc-ink:#141414;--acc-soft:#ffffff12;--acc-t:#F2F0EE;
  --glass:rgba(24,24,26,.8);--glass-line:rgba(255,255,255,.07);
  --sh-1:0 0 0 1px var(--hair),0 8px 22px -14px #000;--sh-2:0 18px 40px -16px #000;
  --ok:#3BC07A;--ok-bg:#3BC07A1c;--ok-ink:#6AD49C;--warn:#FF4A3B;--warn-bg:#FF4A3B1c;--warn-ink:#FF7B6E;
  --info:#9AA4B1;--info-bg:#9AA4B11a;--info-ink:#C2CAD4;
  --floor:#161618;--floor-2:#111113;--red:#FF4A3B;color-scheme:dark}
/* buttons: ink pill, no glow */
.btn.brand{background:var(--acc);color:var(--acc-ink);box-shadow:0 10px 22px -14px #000c}
.fab{background:var(--acc);color:var(--acc-ink);box-shadow:0 14px 28px -14px #000c,inset 0 1px 0 #ffffff1f}
.chip.on,.seg .si,.tabs .ind{background:var(--acc)}
.toggle[aria-checked="true"]{background:var(--ok)}
/* logo + stage hero = ceramic icon */
.logo{background:none;box-shadow:0 6px 14px -8px #0006;overflow:hidden;border-radius:13px}
.logo svg{width:100%;height:100%;display:block}
.cer-hero{width:118px;height:118px;border-radius:30px;overflow:hidden;box-shadow:0 22px 30px -16px #0000006b,0 0 0 1px #0000000a}
.cer-hero svg{width:100%;height:100%;display:block}
.cer-sh{width:90px;height:10px;margin:10px auto 0;border-radius:50%;background:#000;opacity:.12;filter:blur(4px)}
.home-stg{background:radial-gradient(90% 80% at 75% 30%,#ffffff,transparent 70%),var(--surface)}
.phone[data-theme="dark"] .home-stg{background:radial-gradient(90% 80% at 75% 30%,#2a2a2e,transparent 70%),var(--surface)}
.home-stg .hero{width:118px;bottom:24px;left:72%}
.hero.off .bb{filter:grayscale(1);opacity:.5}
.hero.block .bb{animation:blockb .7s var(--spring)}
/* KPI hero tile: ink block with red number accent */
.kpi.hot{background:var(--acc);color:var(--acc-ink)}
.kpi.hot .mute{color:color-mix(in srgb,var(--acc-ink) 65%,transparent)}
.kpi.hot .tile{background:#ffffff14;color:var(--red)}
.phone[data-theme="dark"] .kpi.hot .tile{background:#00000010}
.kpi.hot .t-num-l{color:var(--acc-ink)}
/* chart: today bar red, others ceramic */
.chart .c i{background:var(--surface-2)}
.chart .c.on i{background:var(--red)}
/* type tiles: ink glyph on ceramic */
.tile.acc{background:var(--surface-2);color:var(--text)}
.badge.acc{background:var(--surface-2);color:var(--text)}
.prot{background:var(--ok-bg);color:var(--ok-ink)}
.rule.fresh{animation:freshC 1.2s var(--ease)}
@keyframes freshC{0%{box-shadow:0 0 0 2px var(--red),var(--sh-1)}100%{box-shadow:var(--sh-1)}}
.opt.on{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--acc)}
.opt.on .ic{color:var(--red)}
.tester.hit{background:var(--warn-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--red) 40%,transparent)}
.prot-card{background:radial-gradient(90% 90% at 100% 0%,#ffffff,transparent 60%),var(--surface)}
.phone[data-theme="dark"] .prot-card{background:radial-gradient(90% 90% at 100% 0%,#2a2a2e,transparent 60%),var(--surface)}
.tile.solid{background:var(--acc);color:var(--acc-ink)}
.sys-acts button,.phone[data-theme="dark"] .sys-acts button{color:var(--text)}

<script>
/* =====================================================================
   STARTER engine.js — production-prototype skill (proven on Biko + Kilo)
   Provides: $ $$ ic() bd() · sound bus (ac/tone/bell/warm/gate/MOMENT) · hap() + HLOG
             router (go/rerender/stagger/sliver/heroReact) · Dynamic Island (island/closeIsland/LIVE hooks) + ISLLOG
             sheet()/closeSheet() · ripple + selection haptics · seg()/segBind() · swipe() · chrome (tabs/mute/home/reset/fit/bump)
   Your app.js must define BEFORE this file runs its last line (boot()):
     R={},A={}           screen render / bind functions
     APP={tabs:[...], home:"today", theme:scr=>"dark"|"light"|..., noLive:[...screens hiding the live pill], bumpIds:[...]}
     SFX={...}            outcome cues (start from SFX_BASE below)
     init()               builds S and calls go(first)
     LIVE (optional)      {on:()=>bool, compact:()=>html, card:()=>html, bind:(el)=>void} for an ongoing session
   Expose to window for QA: go, S-reading helpers, sheets.
   ===================================================================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const V=$("#view"),TABS=$("#tabs"),PH=$("#phone");
/* Solar: bold duotone by default (tiles, active, island); linear for "s", "xs", "lin" (inline + chrome) */
const ic=(n,c="")=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}${/(^| )(s|xs|lin)( |$)/.test(c)?"-l":""}"/></svg>`;
const bd=(txt,kind="",icon="")=>`<span class="badge t-label ${kind}">${icon?ic(icon,"xs"):""}${txt}</span>`;

/* ================= SOUND (Web Audio, no assets) ================= */
let AC=null,muted=false,BUS=null,REV=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.15;
    const mg=AC.createGain();mg.gain.value=.6;comp.connect(mg).connect(AC.destination);BUS=comp;
    const len=AC.sampleRate*1.1,ir=AC.createBuffer(2,len,AC.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
    REV=AC.createConvolver();REV.buffer=ir;const rg=AC.createGain();rg.gain.value=.2;REV.connect(rg).connect(comp)}catch{return null}}
  if(AC.state==="suspended")AC.resume();return AC}
function route(c,node,o){let n=node;if(o.lp){const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=o.lp;n.connect(f);n=f}
  n.connect(BUS);if(o.rev){const g=c.createGain();g.gain.value=o.rev;n.connect(g).connect(REV)}}
function tone(f,d=.08,type="sine",v=.12,when=0,to=null,o={}){if(muted)return;const c=ac();if(!c)return;const t=c.currentTime+when;
  const os=c.createOscillator(),g=c.createGain();os.type=type;os.frequency.setValueAtTime(f,t);if(to)os.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(o.a||.006));g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g);route(c,g,o);os.start(t);os.stop(t+d+.03)}
function bell(f,d=.5,v=.07,when=0,rev=.3){tone(f,d,"sine",v,when,null,{rev,a:.004});tone(f*2.01,d*.55,"sine",v*.32,when,null,{rev});tone(f*3.92,d*.22,"sine",v*.1,when,null,{rev})}
const warm=(f,d,v,when=0,o={})=>tone(f,d,"sine",v,when,null,Object.assign({lp:2400,a:.012,rev:.18},o));
const GATE={};const gate=(k,ms)=>{const n=performance.now();if(GATE[k]&&n-GATE[k]<ms)return false;GATE[k]=n;return true};
const MOMENT=()=>gate("moment",220);
/* haptics: Apple-HIG vocabulary, rate-limited; notifications share one 300ms gate */
const HAPT={select:[3],light:[6],soft:[9],medium:[12],rigid:[7],heavy:[18],success:[8,70,16],warning:[16,90,16],error:[20,50,20,50,26]};
const HGAP={select:30,light:45,soft:60,medium:80,rigid:60,heavy:120,success:300,warning:300,error:300};
const HLOG=[];
const buzz=ms=>{try{if(navigator.userActivation?.hasBeenActive&&navigator.vibrate)navigator.vibrate(ms)}catch{}};
function hap(k){if(typeof S!=="undefined"&&S&&S.haptics===false)return;const p=HAPT[k];if(!p)return;if(!gate("h-"+(p.length>1?"n":k),HGAP[k]))return;HLOG.push(k);buzz(p);
  if(k==="error"||k==="warning"||k==="success"||k==="heavy"){const d=$("#device");d.classList.remove("hx-"+k);void d.offsetWidth;d.classList.add("hx-"+k);setTimeout(()=>d.classList.remove("hx-"+k),420)}}
/* plate clack: rubber bumper on platform — low thud + tiny steel tick */
/* generic outcome cues — copy into your SFX and add 2–3 domain one-shots (see motion-sound-haptics.md) */
const SFX_BASE={
  ok(){if(!MOMENT())return;warm(659,.32,.05);warm(988,.42,.045,.09);hap("medium")},
  success(){if(!MOMENT())return;[523,659,784].forEach((f,i)=>warm(f,.55,.045,i*.11,{rev:.28}));warm(1047,.8,.035,.33,{rev:.35});hap("success")},
  err(){if(!MOMENT())return;tone(330,.18,"triangle",.045,0,294,{lp:1200,a:.012});tone(262,.26,"triangle",.045,.16,233,{lp:1000,a:.012});hap("error")},
  alert(){if(!MOMENT())return;warm(784,.35,.045);warm(587,.5,.045,.16);hap("warning")},
  copy(){if(!gate("copy",500))return;warm(1760,.1,.03,0,{lp:3600,rev:.1});warm(2349,.16,.025,.06,{lp:3600,rev:.15});hap("light")},
  empty(){if(!MOMENT())return;warm(392,.3,.03,0,{lp:1400});warm(330,.45,.028,.12,{lp:1200});hap("soft")},
  allow(){if(!MOMENT())return;warm(784,.2,.035,0,{lp:3000});warm(1047,.35,.03,.08,{lp:3200,rev:.25});hap("success")},
  deny(){if(!gate("deny",300))return;warm(523,.2,.022,0,{lp:1800});warm(440,.3,.02,.08,{lp:1600});hap("soft")},
  bye(){if(!MOMENT())return;[784,659,523].forEach((f,i)=>warm(f,.4,.04,i*.12,{lp:2200,rev:.3}));hap("medium")},
  tick(){if(!gate("rtick",600))return;warm(1568,.08,.012,0,{lp:3600,rev:.05})},
  expand(){if(!gate("expand",250))return;tone(440,.25,"sine",.018,0,880,{lp:2200,a:.03});hap("light")},
  collapse(){if(!gate("expand",250))return;tone(880,.2,"sine",.016,0,440,{lp:2000,a:.03});hap("soft")},
};

/* ================= ROUTER ================= */
let S;
function setTheme(scr){PH.dataset.theme=APP.theme(scr)}
function go(scr,dir){S.scr=scr;dir=dir||"f";
  const t=APP.tabs.indexOf(scr),tabbed=t>=0;TABS.hidden=!tabbed;PH.classList.toggle("notabs",!tabbed);
  $$(".tabs button").forEach((b,i)=>{const on=i===t;b.classList.toggle("on",on);b.querySelector("use").setAttribute("href",`#i-${b.dataset.ic}${on?"":"-l"}`)});
  const ind=$("#tabind");ind.style.transform=`translateX(${Math.max(t,0)*100}%)`;ind.style.opacity=t<0?0:1;
  setTheme(scr);PH.classList.toggle("nosf",!!(APP.full||[]).includes(scr));
  V.className="view"+((APP.full||[]).includes(scr)?" full":"");void V.offsetWidth;V.classList.add(dir);V.scrollTop=0;
  V.innerHTML=R[scr]();stagger();(A[scr]||(()=>{}))();sliver();islandSync()}
function rerender(){const sc=V.scrollTop;V.classList.add("still");V.innerHTML=R[S.scr]();V.scrollTop=sc;(A[S.scr]||(()=>{}))();sliver();islandSync()}
function stagger(){V.querySelectorAll(".st").forEach((e,i)=>e.style.setProperty("--i",i))}
/* sliver: put cbar(title,back) first in a scrolling screen; it pins (top:-60px, see pitfalls) once the big title scrolls away */
const cbar=(title,back)=>`<div class="cbar ${back?"":"nb"}">${back||""}<b class="t-h ell">${title}</b></div>`;
function sliver(){const c=V.querySelector(".cbar");V.onscroll=c?()=>c.classList.toggle("on",V.scrollTop>52):null;if(c)c.classList.toggle("on",V.scrollTop>52)}
/* hero reacts to state: "stall" (error) · "hop" (success) · "rep"/custom (physical event); returns to "idle" */
function heroReact(cls,sel=".hero"){V.querySelectorAll(sel).forEach(h=>{h.classList.remove("rep","stall","hop","idle");void h.offsetWidth;h.classList.add(cls);setTimeout(()=>{h.classList.remove(cls);h.classList.add("idle")},1000)})}

/* ---------- Dynamic Island (engine from reference: queue, pre-grow, hover-pause, swipe-up dismiss, live activity) ---------- */
const TINT={ok:"var(--ok)",warn:"var(--warn)",info:"var(--info)",acc:"var(--acc)"};
const ISLQ=[],ISLLOG=[];let islShownAt=0,islQT=null,islT;
function island(title,sub,icon="check",bg="var(--ok)",ms=2800,act){ISLLOG.push({title,sub,icon,bg,act:act&&act.l});const I=$("#island");const age=performance.now()-islShownAt;
  if((I.classList.contains("open")||I.classList.contains("pre"))&&!I.classList.contains("closing")&&age<900){ISLQ.push([title,sub,icon,bg,ms,act]);clearTimeout(islQT);islQT=setTimeout(()=>{const n=ISLQ.shift();if(n)islandShow(...n)},900-age);return}
  islandShow(title,sub,icon,bg,ms,act)}
function islandShow(title,sub,icon="check",bg="var(--ok)",ms=2800,act){const I=$("#island"),IN=$("#islandIn");islShownAt=performance.now();
  clearTimeout(islT);clearTimeout(island.t2);clearTimeout(island.t3);I.classList.remove("closing","big");
  const swap=I.classList.contains("open");
  IN.innerHTML=`<span class="isl-ic" style="background:${bg}">${ic(icon,"s")}</span><span class="isl-tx"><b>${title}</b><small>${sub||""}</small></span>${act?`<button class="isl-act" style="background:${bg}">${act.l}</button>`:""}<span class="isl-pr" style="--ms:${ms}ms"></span>`;
  if(act)IN.querySelector(".isl-act").onclick=e=>{e.stopPropagation();hap("medium");closeIsland();act.f()};
  I.style.setProperty("--tint",bg);const lim=act?24:36;I.classList.toggle("tall",(sub||"").length>lim||title.length>(act?18:28));
  if(swap){IN.classList.remove("swap");void IN.offsetWidth;IN.classList.add("swap")}
  else{IN.classList.remove("swap");I.classList.remove("drop","open");I.classList.add("pre");island.t3=setTimeout(()=>{I.classList.remove("pre");void I.offsetWidth;I.classList.add("open","drop")},140)}
  islT=setTimeout(closeIsland,ms)}
(function(){const I=$("#island");let y0=null;
  I.addEventListener("pointerenter",()=>{if(!I.classList.contains("open"))return;clearTimeout(islT);I.classList.add("hold")});
  I.addEventListener("pointerleave",()=>{if(!I.classList.contains("hold"))return;I.classList.remove("hold");islT=setTimeout(closeIsland,1400)});
  I.addEventListener("pointerdown",e=>{y0=e.clientY});
  I.addEventListener("pointermove",e=>{if(y0==null||!I.classList.contains("open"))return;const dy=Math.min(0,e.clientY-y0);I.style.translate=`-50% ${dy*.4}px`});
  I.addEventListener("pointerup",e=>{if(y0==null)return;const dy=e.clientY-y0;y0=null;I.style.translate="";if(dy<-18&&I.classList.contains("open")){I.dataset.swiped=1;closeIsland();setTimeout(()=>delete I.dataset.swiped,300)}});
})();
function closeIsland(){const I=$("#island");

function roleDialog(done){const d=document.createElement("div");d.className="sys";let pick="globber";

  const close=ok=>{d.style.animation="fadeout .2s forwards";setTimeout(()=>d.remove(),200);done(ok)};
  d.querySelector("#sysNo").onclick=()=>{SFX.deny();close(false);island("Screening not enabled","Globber can't block calls until it's set","warning","var(--warn)")};
  d.querySelector("#sysOk").onclick=()=>{if(pick!=="globber"){SFX.deny();close(false);island("Phone by Google kept","Globber needs the screening role to block","info","var(--info)",3000);return}

/* demo-critical moment: incoming spam call blocked by "+91 140*" */
const SIM=["+91 140 4482 917","1900 410 2266","+91 44 2300 0000"];
function simulateCall(){const n=SIM[S.simIdx%SIM.length];S.simIdx++;const r=S.rules.find(x=>x.on&&matches(x,n));
  const o=document.createElement("div");o.className="inc";
  o.innerHTML=`<span class="t-label" style="opacity:.6">Incoming call</span><div class="av">${ic("user","l")}</div><b class="t-title num-call">${n}</b><span class="t-meta" style="opacity:.6">Mobile · India</span>
   <div class="stamp"><span class="seal">${ic("forbidden")}</span><b class="t-h">Blocked by Globber</b><span class="t-meta" style="opacity:.7">Matched <span class="num-call">${r?r.pattern:""}</span> · never rang</span></div>
   <div class="ans"><span class="r">${ic("endcall")}</span><span>${ic("call")}</span></div>`;
  PH.appendChild(o);SFX.ring();hap("medium");
  if(!S.role||!r){setTimeout(()=>{o.classList.add("out");setTimeout(()=>o.remove(),450);
      island(S.role?"Call let through":"Not screening",S.role?"No rule matched this number":"Set Globber as call screening app first",S.role?"call":"warning",S.role?"var(--info)":"var(--warn)");SFX.alert()},1500);return}
  setTimeout(()=>{o.classList.add("blocked");SFX.block()},900);
  setTimeout(()=>{o.classList.add("out");setTimeout(()=>o.remove(),450);r.hits++;S.log.unshift({id:Date.now(),number:n,rule:r.id,t:TODAY.getTime()+S.simIdx*60000});
    if(S.scr==="home")rerender();
    if(S.notify)island("Blocked "+n,`Matched ${r.pattern} · ${ACTS[r.action][3]}`,"forbidden","var(--warn)",3200,{l:"View",f:()=>go("log")})},2600)}

const RF=[["all","All"],["on","Active"],["off","Paused"],["STARTS","Starts with"],["CONTAINS","Contains"],["ENDS","Ends with"],["EXACT","Exact"],["REGEX","Regex"]];
function visibleRules(){const q=S.q.toLowerCase();let l=S.rules.filter(r=>(!q||r.pattern.toLowerCase().includes(q)||r.label.toLowerCase().includes(q))&&
  (S.f==="all"||(S.f==="on"&&r.on)||(S.f==="off"&&!r.on)||r.type===S.f));
  return S.sort==="hits"?l.sort((a,b)=>b.hits-a.hits):l.sort((a,b)=>b.id-a.id)}
const ruleCard=(r,i)=>`<div class="rule press st ${r.on?"":"off"} ${r.fresh?"fresh":""}" data-rule="${r.id}" style="--i:${i}">${typeTile(r.type)}
  <span class="main"><b class="pat ell">${r.pattern}</b><span class="t-meta mute ell">${r.label||TYPES[r.type][0]}</span><span class="meta">${actBadge(r.action)}${bd(TYPES[r.type][0])}</span></span>

/* add / edit rule sheet with live tester */
function ruleSheet(rule,prefill){const ed=!!rule;const d=rule?{...rule}:{pattern:prefill?.pattern||"",type:prefill?.type||"STARTS",label:prefill?.label||"",action:"REJECT",on:true,hits:0};
  let test=prefill?.test||"+91 140 4482 917";
  const testHTML=()=>{const ok=d.pattern.trim()&&matches(d,test);return`<span class="tile sm ${ok?"warn":"ok"}">${ic(ok?"forbidden":"call","s")}</span><span class="grow stack-1"><input id="tn" class="t-num num-call" style="border:0;background:none;outline:0;color:inherit;width:100%" value="${test}" aria-label="Test number"><span class="t-meta mute">${!d.pattern.trim()?"Type a pattern to test":ok?"Would be "+ACTS[d.action][3]:"Would ring normally"}</span></span>`};
  sheet(`<div class="sheet-h"><b class="t-title">${ed?"Edit rule":"New rule"}</b>${ed?`<button class="icon-btn press" id="del" aria-label="Delete rule">${ic("trash","s")}</button>`:""}</div>
   <div class="lbl-f"><span class="t-label">Pattern</span><label class="field mono" id="pf">${ic("hash","s")}<input id="pat" placeholder="+91 140*" value="${d.pattern.replace(/"/g,"&quot;")}"></label><span class="err-msg t-meta" id="perr" hidden></span></div>
   <div class="lbl-f"><span class="t-label">Match type</span><div class="chips" id="types">${Object.entries(TYPES).map(([k,[l]])=>`<button class="chip ${d.type===k?"on":""}" data-t="${k}">${l}</button>`).join("")}</div></div>
   <div class="lbl-f"><span class="t-label">Test a number</span><div class="tester" id="tester">${testHTML()}</div></div>
   <div class="lbl-f"><span class="t-label">When it matches</span><div class="opts3">${Object.entries(ACTS).map(([k,[l,i]])=>`<button class="opt press ${d.action===k?"on":""}" data-a="${k}">${ic(i)}<b class="t-label">${l}</b></button>`).join("")}</div></div>
   <div class="lbl-f"><span class="t-label">Label (optional)</span><label class="field">${ic("pen","s")}<input id="lab" placeholder="e.g. Loan offers" value="${d.label}"></label></div>
   <button class="btn brand press" id="save">${ic("check","s")} ${ed?"Save changes":"Add rule"}</button>`,s=>{
    const tester=s.querySelector("#tester");
    const paint=()=>{const ok=d.pattern.trim()&&matches(d,test);tester.className="tester "+(ok?"hit":"miss");tester.innerHTML=testHTML();const tn=tester.querySelector("#tn");tn.oninput=()=>{test=tn.value;const p=tn.selectionStart;paint();const n=s.querySelector("#tn");n.focus();n.setSelectionRange(p,p)}};paint();
    const err=m=>{const e=s.querySelector("#perr");e.hidden=!m;e.innerHTML=m?ic("warning","xs")+m:"";s.querySelector("#pf").classList.toggle("err",!!m)};
    const pat=s.querySelector("#pat");pat.oninput=()=>{d.pattern=pat.value;err("");paint()};
    s.querySelector("#lab").oninput=e=>d.label=e.target.value;
    s.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{d.type=b.dataset.t;hap("select");s.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b));pat.placeholder=d.type==="REGEX"?"^\\+91 ?140":"+91 140*";err("");paint()});
    s.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{d.action=b.dataset.a;hap("select");s.querySelectorAll("[data-a]").forEach(x=>x.classList.toggle("on",x===b));paint()});
    s.querySelector("#save").onclick=()=>{const p=d.pattern.trim();
      const m=!p?"Enter a number or pattern":d.type==="REGEX"&&!validRegex(p)?"That regex isn't valid":d.type!=="REGEX"&&digits(p).replace(/\*/g,"").length<3?"Use at least 3 digits":
        S.rules.some(r=>r.id!==d.id&&r.pattern===p&&r.type===d.type)?"You already have this rule":"";
      if(m){err(m);SFX.err();s.querySelector("#pf").classList.remove("shake");void s.offsetWidth;s.querySelector("#pf").classList.add("shake");return}
      d.pattern=p;if(ed){Object.assign(rule,d)}else{d.id=S.nextId++;d.fresh=true;S.rules.unshift(d)}
      closeSheet(s);SFX.success();if(S.scr!=="rules")go("rules");else rerender();
      island(ed?"Rule saved":"Rule added",`${p} · ${ACTS[d.action][0]}`,"check","var(--ok)")};
    s.querySelector("#del")&&(s.querySelector("#del").onclick=()=>{closeSheet(s);confirmSheet("Delete this rule?",`<span class="num-call">${rule.pattern}</span> will stop blocking calls. Past log entries stay.`,"Delete rule",()=>{
      S.rules=S.rules.filter(r=>r!==rule);rerender();SFX.bye();island("Rule deleted",rule.pattern,"trash","var(--warn)",3000,{l:"Undo",f:()=>{S.rules.push(rule);rerender();SFX.ok()}})})})})}
function confirmSheet(title,body,cta,ok){sheet(`<div class="center stack" style="padding-top:4px"><span class="tile lg warn">${ic("trash")}</span><b class="t-title">${title}</b><p class="t-body mute">${body}</p></div>
  <div class="stack"><button class="btn danger press" id="cok">${cta}</button><button class="btn ghost press" data-close>Cancel</button></div>`,s=>{hap("warning");s.querySelector("#cok").onclick=()=>{hap("medium");closeSheet(s);ok()}})}

  <div class="privacy st"><span class="tile ok">${ic("lock")}</span><span class="t-meta mute grow">No internet permission, no analytics, no ads. Everything stays on this phone.</span></div>
  <p class="ver t-label mute st">Globber 1.0.6 · app.globber</p>`;
A.settings=()=>{$("#roleB").onclick=()=>roleDialog(ok=>{if(ok){S.role=true;rerender()}});
  bindToggle("sContacts","contacts",on=>{if(on){S.contacts=false;$("#sContacts").setAttribute("aria-checked",false);contactsSheet()}else rerender()});
  bindToggle("sUnknown","unknown",on=>island(on?"Hidden numbers blocked":"Hidden numbers allowed","Applies to private & withheld IDs",on?"forbidden":"call",on?"var(--warn)":"var(--info)",2000));
  bindToggle("sNotify","notify");bindToggle("sHap","haptics");
  segBind(V,"[data-seg=th]",v=>{S.theme=v;setTheme("settings")});
  $("#allowL").onclick=()=>sheet(`<b class="t-title">Allowed numbers</b>${S.allow.length?`<div class="txcard">${S.allow.map(n=>`<div class="txr"><span class="tile ok">${ic("check")}</span><span class="main"><b class="t-num num-call">${n}</b><span class="t-meta mute">Always rings</span></span><span></span></div>`).join("")}</div>`:`<div class="empty">${ic("check","l")}<b class="t-h">No exceptions yet</b><span class="t-meta mute">Open a blocked call and tap “Always allow” to add one.</span></div>`}<button class="btn ghost press" data-close>Done</button>`);
  $("#exp").onclick=()=>{SFX.success();island("Rules exported","globber-rules-2026-10-17.json · Downloads","download","var(--ok)",3000)};
  $("#imp").onclick=importSheet};
function contactsSheet(){sheet(`<div class="center stack"><span class="tile lg info">${ic("users")}</span><b class="t-title">Allow Globber to see contacts?</b>
  <p class="t-body mute">Only used to let saved contacts through. Contacts never leave your phone.</p></div>
  <div class="stack"><button class="btn brand press" id="cAllow">Allow</button><button class="btn ghost press" id="cDeny">Don't allow</button></div>`,s=>{
  s.querySelector("#cAllow").onclick=()=>{S.contacts=true;closeSheet(s);SFX.allow();rerender();island("Contacts let through","Saved contacts will always ring","users","var(--ok)")};
  s.querySelector("#cDeny").onclick=()=>{closeSheet(s);SFX.deny();island("Permission denied","Contacts can't bypass rules","warning","var(--warn)")}})}
function importSheet(){const inc=[{pattern:"+91 160*",type:"STARTS",label:"Service-call series",action:"SILENCE"},{pattern:"*9999",type:"ENDS",label:"Fake bank IVR",action:"REJECT"},{pattern:"+91 140*",type:"STARTS",label:"Telemarketing series",action:"REJECT"}];
  const dup=r=>S.rules.some(x=>x.pattern===r.pattern&&x.type===r.type);
  sheet(`<div class="sheet-h"><b class="t-title">Import rules</b>${bd("JSON","info")}</div>
   <div class="card glass row start" style="background:var(--surface-2)"><span class="tile acc">${ic("download")}</span><span class="grow stack-1"><b class="t-num ell">globber-rules-2026-09-02.json</b><span class="t-meta mute">Downloads · 3 rules · 2 KB</span></span></div>
   <div class="txcard">${inc.map(r=>`<div class="txr"><span class="tile acc type-tile">${TYPES[r.type][1]}</span><span class="main"><b class="t-num num-call">${r.pattern}</b><span class="t-meta mute">${r.label}</span></span><span class="end">${dup(r)?bd("Duplicate"):bd("New","ok")}</span></div>`).join("")}</div>
   <button class="btn brand press" id="doImp">${ic("import","s")} Import ${inc.filter(r=>!dup(r)).length} new rules</button>`,s=>{
   s.querySelector("#doImp").onclick=()=>{const add=inc.filter(r=>!dup(r)).map(r=>({...r,id:S.nextId++,on:true,hits:0,fresh:true}));S.rules.unshift(...add);closeSheet(s);SFX.success();rerender();
     island(add.length+" rules imported","1 duplicate skipped","import","var(--ok)")}})}
